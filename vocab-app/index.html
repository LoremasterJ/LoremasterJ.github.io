<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Vocabulary Estimator & Leaderboard</title>
  
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #151e2e;
      --border: #23324a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #34d399;
      --danger: #f87171;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
    .container { max-width: 760px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; box-shadow: 0 15px 35px rgba(0,0,0,0.4); margin: auto; }

    .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .tier-badge { background: rgba(56, 189, 248, 0.12); color: var(--primary); padding: 0.35rem 0.85rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .progress-text { color: var(--muted); font-size: 0.85rem; }
    .progress-bar-bg { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.25s ease; }

    .word-title { font-size: 2.4rem; font-weight: 800; color: #fff; margin-bottom: 0.2rem; }
    .word-meta { color: var(--muted); font-style: italic; margin-bottom: 1.75rem; font-size: 0.95rem; }
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem; }
    
    .option-btn {
      background: #0d1524; border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.25rem; color: var(--text); text-align: left; cursor: pointer;
      font-size: 0.95rem; line-height: 1.4; transition: all 0.15s ease; outline: none;
    }
    .option-btn:hover { border-color: var(--primary); background: #131d31; }
    .option-btn.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.15); font-weight: 600; color: #fff; }

    .btn-action {
      background: var(--primary); color: #0b0f19; border: none; border-radius: 8px;
      padding: 0.9rem 1.5rem; font-size: 1rem; font-weight: 700; cursor: pointer;
      width: 100%; transition: background 0.2s ease;
    }
    .btn-action:hover { background: var(--primary-hover); }
    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Results UI */
    .result-view { text-align: center; }
    .result-header { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .score-total { font-size: 3.5rem; font-weight: 900; color: var(--accent); margin-bottom: 0.25rem; }
    .rank-pill { display: inline-block; background: rgba(52, 211, 153, 0.12); color: var(--accent); padding: 0.35rem 1.2rem; border-radius: 999px; font-weight: 700; margin-bottom: 1.5rem; }
    
    .tier-breakdown { text-align: left; margin: 1.5rem 0; }
    .tier-row { margin-bottom: 1rem; }
    .tier-label-group { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.35rem; }
    .bar-track { background: #0d1524; height: 7px; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; }
    .bar-inner { height: 100%; background: var(--primary); width: 0%; border-radius: 4px; transition: width 0.8s ease; }

    /* Name Submission & Scoreboard */
    .save-section {
      background: #0d1524; border: 1px solid var(--border); border-radius: 12px;
      padding: 1.25rem; margin: 1.5rem 0; display: flex; gap: 0.75rem;
    }
    .name-input {
      flex: 1; background: #080d16; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem 1rem; color: #fff; font-size: 0.95rem; outline: none;
    }
    .name-input:focus { border-color: var(--primary); }
    .btn-save { width: auto; padding: 0 1.5rem; white-space: nowrap; }

    .section-headline { font-size: 1.15rem; font-weight: 700; margin: 2rem 0 0.85rem; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    
    /* Leaderboard UI */
    .leaderboard-list { background: #0d1524; border: 1px solid var(--border); border-radius: 12px; max-height: 280px; overflow-y: auto; text-align: left; }
    .lb-row { display: grid; grid-template-columns: 36px 1fr auto auto; gap: 0.75rem; align-items: center; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { font-weight: 700; color: var(--muted); }
    .lb-rank.top-1 { color: var(--gold); }
    .lb-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-tag { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 4px; background: rgba(56, 189, 248, 0.1); color: var(--primary); font-weight: 600; white-space: nowrap; }
    .lb-score { color: var(--accent); font-weight: 700; text-align: right; }

    /* Review / Missed Words Section */
    .missed-list { background: #0d1524; border: 1px solid var(--border); border-radius: 12px; max-height: 320px; overflow-y: auto; text-align: left; padding: 0.5rem; }
    .missed-card { background: #111a2c; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .missed-card:last-child { margin-bottom: 0; }
    .missed-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
    .missed-word { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .missed-tier { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .answer-line { margin-top: 0.35rem; line-height: 1.4; }
    .answer-line.wrong { color: var(--danger); }
    .answer-line.correct { color: var(--accent); font-weight: 600; }
    .perfect-banner { background: rgba(52, 211, 153, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 1.25rem; border-radius: 8px; text-align: center; font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  <!-- Quiz Interface -->
  <div id="quiz-screen">
    <div class="meta-bar">
      <span class="tier-badge" id="tier-indicator">Beginner</span>
      <span class="progress-text" id="progress-text">Question 1 of 35</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <div class="word-title" id="word-target">Loading...</div>
    <div class="word-meta" id="word-type">...</div>

    <div class="options-grid" id="options-container"></div>
    <button class="btn-action" id="next-btn" disabled onclick="handleNext()">Next Word</button>
  </div>

  <!-- Results, Review & Leaderboard Interface -->
  <div id="result-screen" class="result-view" style="display: none;">
    <p class="result-header">Estimated English Vocabulary Size</p>
    <div class="score-total" id="final-vocab-count">0</div>
    <div class="rank-pill" id="final-rank">Evaluating...</div>

    <div class="tier-breakdown" id="tier-results-list"></div>

    <!-- Name Entry Form -->
    <div class="save-section" id="submit-box">
      <input type="text" id="player-name" class="name-input" placeholder="Enter your name for the scoreboard" maxlength="20" />
      <button class="btn-action btn-save" onclick="saveScore()">Post Score</button>
    </div>

    <!-- Review Missed Words Section -->
    <div class="section-headline">
      <span>Performance Review</span>
      <span id="missed-count-tag" style="font-size: 0.8rem; color: var(--muted); font-weight: normal;"></span>
    </div>
    <div class="missed-list" id="missed-container"></div>

    <!-- Live Leaderboard -->
    <div class="section-headline">
      <span>Community Leaderboard</span>
      <span style="font-size: 0.8rem; color: var(--muted); font-weight: normal;">Ranked by Vocabulary Size</span>
    </div>
    <div class="leaderboard-list" id="leaderboard-container">
      <div class="lb-row" style="color: var(--muted); grid-template-columns: 1fr;">Loading scoreboard...</div>
    </div>

    <button class="btn-action" style="margin-top: 2rem; background: var(--border); color: #fff;" onclick="restartTest()">Retake Assessment</button>
  </div>
</div>

<script>

  // Master bank containing multiple sets of words

      { word: "tedious", pos: "adjective", correctText: "Too long, slow, or dull; tiresome or monotonous", distractors: ["Physically dangerous to carry out alone", "Requiring advanced mathematical calculation", "Composed of delicate and fragile materials"] },
      { word: "hesitate", pos: "verb", correctText: "To pause briefly before saying or doing something", distractors: ["To pause briefly due to physical exhaustion", "To pause briefly to observe distant scenery", "To pause briefly during formal speech delivery"] },
      { word: "glance", pos: "verb", correctText: "To look quickly and briefly at something", distractors: ["To look intensely and steadily at something", "To look secretively through an opening", "To look angrily at an opposing person"] },
      { word: "reluctant", pos: "adjective", correctText: "Feeling hesitant and unwilling to act", distractors: ["Feeling anxious about future uncertainty", "Feeling indifferent to outside advice", "Feeling unable to make logical sense"] },
      { word: "abundant", pos: "adjective", correctText: "Existing in large, plentiful quantities", distractors: ["Existing in small, concentrated amounts", "Existing in rare, prized distributions", "Existing in dense, unorganized clumps"] },

      { word: "hostile", pos: "adjective", correctText: "Showing open, aggressive unfriendliness", distractors: ["Showing cold, detached disinterest", "Showing excessive, frantic nervousness", "Showing stubborn, quiet disagreement"] }
    ],

      { word: "resilient", pos: "adjective", correctText: "Able to recover quickly from difficulties or setbacks", distractors: ["Incapable of sustaining any physical deformation", "Prone to bending without breaking permanently", "Unresponsive to outside emotional stimulation"] },

      { word: "pristine", pos: "adjective", correctText: "In its original condition; unspoiled or clean", distractors: ["Preserved inside a secure museum vault", "Constructed using highly modern engineering methods", "Refined through repeated industrial processing"] },
      { word: "reconcile", pos: "verb", correctText: "To restore friendly relations between parties", distractors: ["To document discrepancies found in accounts", "To debate policy before a legislative panel", "To cancel opposing orders to prevent conflict"] },
      { word: "ambiguous", pos: "adjective", correctText: "Open to more than one interpretation; unclear", distractors: ["Grammatically incorrect in formal writing", "Completely devoid of factual corroboration", "Intended solely to cause comedic confusion"] },
      { word: "mitigate", pos: "verb", correctText: "To make a bad situation less severe or serious", distractors: ["To prevent a bad event from happening entirely", "To postpone a bad consequence until a later date", "To identify the underlying cause of a bad result"] },
      { word: "pragmatic", pos: "adjective", correctText: "Guided primarily by practical considerations", distractors: ["Guided primarily by theoretical doctrine", "Guided primarily by emotional conviction", "Guided primarily by historical precedent"] },
      { word: "scrutinize", pos: "verb", correctText: "To examine or inspect very closely and thoroughly", distractors: ["To critique or evaluate from an artistic perspective", "To summarize or condense for quick reading", "To verify or cross-check against an index"] },
      { word: "ubiquitous", pos: "adjective", correctText: "Present, appearing, or found everywhere", distractors: ["Present only in specialized technical contexts", "Present in increasing quantities over time", "Present without drawing conscious notice"] }
    ],
    advanced: [
      { word: "surreptitious", pos: "adjective", correctText: "Kept secret, especially because it would not be approved of", distractors: ["Marked by swift, continuous physical movement", "Operating with complete disregard for civilian law", "Displaying exceptional agility in athletic competition"] },
      { word: "exacerbate", pos: "verb", correctText: "To make a problem, bad situation, or negative feeling worse", distractors: ["To eliminate the root symptoms of a disorder", "To delay resolution through bureaucratic procedures", "To misdiagnose the underlying cause of an affliction"] },
      { word: "anachronistic", pos: "adjective", correctText: "Belonging to a period other than that in which it exists", distractors: ["Arranged in strict chronological sequence of events", "Recorded in ancient, untranslated scripts", "Destined to become obsolete in the near future"] },
      { word: "capricious", pos: "adjective", correctText: "Given to sudden and unaccountable changes of mood or behavior", distractors: ["Steadfast and unchanging in moral dedication", "Excessively fearful of sudden environmental change", "Deliberately contrary solely for argumentative pleasure"] },
      { word: "proclivity", pos: "noun", correctText: "A tendency to choose or do something regularly; an inclination", distractors: ["A formal decree issued by a high magistrate", "A sudden revulsion toward a previously favored hobby", "An inherited talent for memorizing complex narratives"] },
      { word: "trenchant", pos: "adjective", correctText: "Vigorous or incisive in expression or style", distractors: ["Monotonous and repetitive in public delivery", "Subtle and elusive in conveying meaning", "Overly cautious when addressing sensitive topics"] },
      { word: "taciturn", pos: "adjective", correctText: "Reserved or uncommunicative in speech; saying little", distractors: ["Prone to making aggressive rhetorical claims", "Articulate and persuasive in diplomatic circles", "Hesitant when asked to present before a crowd"] },
      { word: "vicissitude", pos: "noun", correctText: "A change of circumstances or fortune, typically unwelcome", distractors: ["A persistent moral corruption within institutions", "A permanent alteration of geological landscape", "An enduring devotion to an artistic discipline"] },
      { word: "quandary", pos: "noun", correctText: "A state of perplexity or uncertainty over what to do in a difficult situation", distractors: ["A heated confrontation regarding contested territorial boundaries", "A prolonged delay caused by contradictory administrative codes", "A complete failure to anticipate catastrophic economic loss"] },
      { word: "sagacious", pos: "adjective", correctText: "Having or showing keen mental discernment and good judgment", distractors: ["Possessing encyclopedic knowledge of ancient myth", "Maintaining rigid adherence to established doctrine", "Demonstrating remarkable physical dexterity under pressure"] },
      { word: "ephemeral", pos: "adjective", correctText: "Lasting for a very short period of time", distractors: ["Physically fragile and prone to crumbling", "Visually faint and difficult to perceive", "Existing only in subjective imagination"] },
      { word: "obfuscate", pos: "verb", correctText: "To make something obscure, unclear, or unintelligible", distractors: ["To fabricate facts to mislead an audience", "To omit critical context to simplify a summary", "To delay delivering an official public statement"] },
      { word: "sycophant", pos: "noun", correctText: "A person who acts obsequiously to gain advantage", distractors: ["A person who attacks cherished traditional beliefs", "A person who displays arrogant intellectual pride", "A person who deceives others for monetary profit"] },
      { word: "recalcitrant", pos: "adjective", correctText: "Obstinately uncooperative toward authority", distractors: ["Reluctant to participate due to lack of skill", "Prone to sudden changes of mood or intention", "Unwilling to communicate with unfamiliar peers"] }
    ],
    grandmaster: [
      { word: "crepuscular", pos: "adjective", correctText: "Resembling or relating to twilight; active at twilight", distractors: ["Pertaining to deep, subterranean caverns", "Characterized by brittle, crystallized formations", "Occurring exclusively during winter solstice"] },
      { word: "supererogatory", pos: "adjective", correctText: "Performed beyond the call of duty or requirement", distractors: ["Mandated by strict ecclesiastical convention", "Obtained through fraudulent administrative loopholes", "Excessively demanding on human physical stamina"] },
      { word: "apocryphal", pos: "adjective", correctText: "Of doubtful authenticity, although widely circulated as true", distractors: ["Accepted without question by scholarly consensus", "Inscribed upon weathered megalithic monuments", "Lost permanently during historical conflicts"] },
      { word: "callipygian", pos: "adjective", correctText: "Having well-shaped or attractive buttocks", distractors: ["Relating to ancient melodic harp compositions", "Exhibiting symmetrical facial proportions in portraiture", "Adorned with intricate gold leaf along the borders"] },
      { word: "apotheosis", pos: "noun", correctText: "The highest point in the development of something; culmination or deification", distractors: ["The complete collapse of a philosophical or cosmological doctrine", "The formal excommunication of an author from literary societies", "The cyclical recurrence of cosmic epochs throughout deep time"] },
      { word: "perspicacity", pos: "noun", correctText: "The quality of having keen mental discernment and insight", distractors: ["The ability to articulate concepts with fluid eloquence", "The capacity to retain extensive factual information", "The tendency to maintain resolute focus under distress"] },
      { word: "sesquipedalian", pos: "adjective", correctText: "Characterized by the use of long words", distractors: ["Characterized by antique grammatical structures", "Characterized by excessively ornate rhetorical style", "Characterized by slow and ponderous delivery"] },
      { word: "defenestration", pos: "noun", correctText: "The act of throwing someone or something out of a window", distractors: ["The act of formally stripping an official of their title", "The act of abolishing an established constitutional body", "The act of dismantling an ancient administrative code"] }
    ]
  };

  // Utility to shuffle arrays
  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  let sessionQuestions = [];
  let currentIndex = 0;
  let selectedOption = null;
  let computedVocabSize = 0;
  let assignedRank = "";
  const userAnswers = [];

  // Build a fresh test session
  function buildSession() {
    sessionQuestions = [];
    userAnswers.length = 0;
    currentIndex = 0;

    for (const tier of ["beginner", "intermediate", "advanced", "grandmaster"]) {
      const config = BAND_CONFIG[tier];
      const shuffledTierWords = shuffleArray(MASTER_POOL[tier]);
      const sampled = shuffledTierWords.slice(0, config.sampleCount);

      sampled.forEach(item => {
        const allOptions = [item.correctText, ...item.distractors];
        const shuffledOptions = shuffleArray(allOptions);
        const correctIndex = shuffledOptions.indexOf(item.correctText);

        sessionQuestions.push({
          word: item.word,
          pos: item.pos,
          tier: tier,
          correct: correctIndex,
          correctText: item.correctText,
          options: shuffledOptions
        });
      });
    }
  }

  function loadQuestion() {
    selectedOption = null;
    const q = sessionQuestions[currentIndex];
    
    document.getElementById("tier-indicator").innerText = q.tier;
    document.getElementById("progress-text").innerText = `Question ${currentIndex + 1} of ${sessionQuestions.length}`;
    document.getElementById("progress-bar").style.width = `${((currentIndex) / sessionQuestions.length) * 100}%`;
    document.getElementById("word-target").innerText = q.word;
    document.getElementById("word-type").innerText = q.pos;
    document.getElementById("next-btn").disabled = true;
    document.getElementById("next-btn").innerText = (currentIndex === sessionQuestions.length - 1) ? "Calculate Vocabulary Size" : "Next Word";

    const container = document.getElementById("options-container");
    container.innerHTML = "";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      container.appendChild(btn);
    });
  }

  function selectOption(index) {
    selectedOption = index;
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
      btn.classList.toggle("selected", idx === index);
    });
    document.getElementById("next-btn").disabled = false;
  }

  function handleNext() {
    if (selectedOption === null) return;
    
    const q = sessionQuestions[currentIndex];
    userAnswers.push({
      word: q.word,
      pos: q.pos,
      tier: q.tier,
      selected: selectedOption,
      correct: q.correct,
      selectedText: q.options[selectedOption],
      correctText: q.correctText,
      isCorrect: selectedOption === q.correct
    });

    currentIndex++;
    if (currentIndex < sessionQuestions.length) {
      loadQuestion();
    } else {
      renderResults();
    }
  }

  function renderResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";

    const stats = {
      beginner: { total: 0, correct: 0 },
      intermediate: { total: 0, correct: 0 },
      advanced: { total: 0, correct: 0 },
      grandmaster: { total: 0, correct: 0 }
    };

    userAnswers.forEach(ans => {
      stats[ans.tier].total++;
      if (ans.isCorrect) stats[ans.tier].correct++;
    });

    let totalVocabulary = 0;
    const listContainer = document.getElementById("tier-results-list");
    listContainer.innerHTML = "";

    for (const [tierKey, data] of Object.entries(stats)) {
      const rawAccuracy = data.total > 0 ? (data.correct / data.total) : 0;
      const adjustedRate = Math.max(0, (4 * rawAccuracy - 1) / 3);
      const tierEstimatedWords = Math.round(adjustedRate * BAND_CONFIG[tierKey].size);
      totalVocabulary += tierEstimatedWords;

      const accuracyPct = Math.round(rawAccuracy * 100);

      listContainer.innerHTML += `
        <div class="tier-row">
          <div class="tier-label-group">
            <span><strong>${BAND_CONFIG[tierKey].label}</strong></span>
            <span style="color: var(--primary); font-weight: 700;">${data.correct}/${data.total} (${accuracyPct}%)</span>
          </div>
          <div class="bar-track">
            <div class="bar-inner" style="width: ${accuracyPct}%"></div>
          </div>
        </div>
      `;
    }

    computedVocabSize = Math.max(800, totalVocabulary);
    document.getElementById("final-vocab-count").innerText = `${computedVocabSize.toLocaleString()} words`;

    if (computedVocabSize > 35000) assignedRank = "Lexical Grandmaster";
    else if (computedVocabSize > 22000) assignedRank = "Avid Reader / Academic";
    else if (computedVocabSize > 12000) assignedRank = "Fluent Professional";
    else if (computedVocabSize > 5000) assignedRank = "Intermediate Speaker";
    else assignedRank = "Basic Communicator";

    document.getElementById("final-rank").innerText = assignedRank;

    renderReviewSection();
    fetchLeaderboard();
  }

  function renderReviewSection() {
    const missed = userAnswers.filter(a => !a.isCorrect);
    const container = document.getElementById("missed-container");
    const countTag = document.getElementById("missed-count-tag");
    container.innerHTML = "";

    if (missed.length === 0) {
      countTag.innerText = "35 / 35 Correct";
      container.innerHTML = `<div class="perfect-banner">⭐ Flawless Assessment! You answered all 35 words correctly.</div>`;
      return;
    }

    countTag.innerText = `${missed.length} words to review`;

    container.innerHTML = missed.map(item => `
      <div class="missed-card">
        <div class="missed-header">
          <span class="missed-word">${escapeHtml(item.word)} <span style="font-size: 0.85rem; color: var(--muted); font-weight: normal;">(${item.pos})</span></span>
          <span class="missed-tier">${item.tier}</span>
        </div>
        <div class="answer-line wrong"><strong>✕ Your answer:</strong> ${escapeHtml(item.selectedText)}</div>
        <div class="answer-line correct"><strong>✓ Correct meaning:</strong> ${escapeHtml(item.correctText)}</div>
      </div>
    `).join("");
  }

  function saveScore() {
    const nameInput = document.getElementById("player-name");
    const name = nameInput.value.trim();
    if (!name) return alert("Please enter a name first!");

    const record = {
      name: name,
      score: Number(computedVocabSize),
      rank: assignedRank,
      timestamp: Date.now()
    };

    db.ref("leaderboard").push(record)
      .then(() => {
        document.getElementById("submit-box").style.display = "none";
      })
      .catch(err => {
        console.error("Database write failed: ", err);
        alert("Failed to record score. Please check database permissions.");
      });
  }

  function fetchLeaderboard() {
    const lbContainer = document.getElementById("leaderboard-container");

    db.ref("leaderboard").on("value", snapshot => {
      const scores = [];
      snapshot.forEach(child => {
        const item = child.val();
        scores.push({
          name: item.name || "Anonymous",
          score: Number(item.score) || 0,
          rank: item.rank || "Evaluated",
          timestamp: item.timestamp || 0
        });
      });

      scores.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return a.timestamp - b.timestamp;
      });

      renderLeaderboardUI(scores.slice(0, 20));
    }, err => {
      console.error("Database read failed: ", err);
      lbContainer.innerHTML = `<div class="lb-row" style="color: var(--muted); grid-template-columns: 1fr;">Unable to load scoreboard. Check database rules.</div>`;
    });
  }

  function renderLeaderboardUI(scores) {
    const lbContainer = document.getElementById("leaderboard-container");
    if (!scores.length) {
      lbContainer.innerHTML = `<div class="lb-row" style="color: var(--muted); grid-template-columns: 1fr;">No scores recorded yet. Be the first!</div>`;
      return;
    }

    lbContainer.innerHTML = scores.map((item, idx) => `
      <div class="lb-row">
        <span class="lb-rank ${idx === 0 ? 'top-1' : ''}">#${idx + 1}</span>
        <span class="lb-name">${escapeHtml(item.name)}</span>
        <span class="lb-tag">${escapeHtml(item.rank)}</span>
        <span class="lb-score">${item.score.toLocaleString()} words</span>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
  }

  function restartTest() {
    document.getElementById("submit-box").style.display = "flex";
    document.getElementById("player-name").value = "";
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    buildSession();
    loadQuestion();
  }

  // Initial startup
  buildSession();
  loadQuestion();
</script>
</body>
</html>
