<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Vocabulary Estimator & Leaderboard</title>
  
  <!-- Firebase SDKs (Compat version for direct CDN usage) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics-compat.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #151e2e;
      --border: #23324a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #34d399;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
    .container { max-width: 720px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }

    .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .tier-badge { background: rgba(56, 189, 248, 0.12); color: var(--primary); padding: 0.35rem 0.85rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .progress-text { color: var(--muted); font-size: 0.85rem; }
    .progress-bar-bg { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.25s ease; }

    .word-title { font-size: 2.4rem; font-weight: 800; color: #fff; margin-bottom: 0.2rem; }
    .word-meta { color: var(--muted); font-style: italic; margin-bottom: 1.75rem; font-size: 0.95rem; }
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem; }
    
    .option-btn {
      background: #0d1524; border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.25rem; color: var(--text); text-align: left; cursor: pointer;
      font-size: 0.95rem; line-height: 1.4; transition: all 0.15s ease; outline: none;
    }
    .option-btn:hover { border-color: var(--primary); background: #131d31; }
    .option-btn.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.15); font-weight: 600; color: #fff; }

    .btn-action {
      background: var(--primary); color: #0b0f19; border: none; border-radius: 8px;
      padding: 0.9rem 1.5rem; font-size: 1rem; font-weight: 700; cursor: pointer;
      width: 100%; transition: background 0.2s ease;
    }
    .btn-action:hover { background: var(--primary-hover); }
    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Results UI */
    .result-view { text-align: center; }
    .result-header { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .score-total { font-size: 3.5rem; font-weight: 900; color: var(--accent); margin-bottom: 0.25rem; }
    .rank-pill { display: inline-block; background: rgba(52, 211, 153, 0.12); color: var(--accent); padding: 0.35rem 1.2rem; border-radius: 999px; font-weight: 700; margin-bottom: 1.5rem; }
    
    .tier-breakdown { text-align: left; margin: 1.5rem 0; }
    .tier-row { margin-bottom: 1rem; }
    .tier-label-group { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.35rem; }
    .bar-track { background: #0d1524; height: 7px; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; }
    .bar-inner { height: 100%; background: var(--primary); width: 0%; border-radius: 4px; transition: width 0.8s ease; }

    /* Name Submission & Leaderboard */
    .save-section {
      background: #0d1524; border: 1px solid var(--border); border-radius: 12px;
      padding: 1.25rem; margin: 1.5rem 0; display: flex; gap: 0.75rem;
    }
    .name-input {
      flex: 1; background: #080d16; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem 1rem; color: #fff; font-size: 0.95rem; outline: none;
    }
    .name-input:focus { border-color: var(--primary); }
    .btn-save { width: auto; padding: 0 1.5rem; white-space: nowrap; }

    .leaderboard-title { font-size: 1.2rem; font-weight: 700; margin: 2rem 0 1rem; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .leaderboard-list { background: #0d1524; border: 1px solid var(--border); border-radius: 12px; max-height: 240px; overflow-y: auto; text-align: left; }
    .lb-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { font-weight: 700; width: 28px; color: var(--muted); }
    .lb-rank.top-1 { color: var(--gold); }
    .lb-name { flex: 1; font-weight: 600; }
    .lb-score { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>

<div class="container">
  <!-- Quiz Interface -->
  <div id="quiz-screen">
    <div class="meta-bar">
      <span class="tier-badge" id="tier-indicator">Beginner</span>
      <span class="progress-text" id="progress-text">Question 1 of 35</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <div class="word-title" id="word-target">hesitate</div>
    <div class="word-meta" id="word-type">verb</div>

    <div class="options-grid" id="options-container"></div>
    <button class="btn-action" id="next-btn" disabled onclick="handleNext()">Next Word</button>
  </div>

  <!-- Results & Leaderboard Interface -->
  <div id="result-screen" class="result-view" style="display: none;">
    <p class="result-header">Estimated English Vocabulary Size</p>
    <div class="score-total" id="final-vocab-count">0</div>
    <div class="rank-pill" id="final-rank">Evaluating...</div>

    <div class="tier-breakdown" id="tier-results-list"></div>

    <!-- Name Entry Form -->
    <div class="save-section" id="submit-box">
      <input type="text" id="player-name" class="name-input" placeholder="Enter your name for the leaderboard" maxlength="24" />
      <button class="btn-action btn-save" onclick="saveScore()">Post Score</button>
    </div>

    <!-- Live Leaderboard -->
    <div class="leaderboard-title">
      <span>Community Leaderboard</span>
      <span style="font-size: 0.8rem; color: var(--muted); font-weight: normal;">Top Wordmasters</span>
    </div>
    <div class="leaderboard-list" id="leaderboard-container">
      <div class="lb-row" style="color: var(--muted);">Loading high scores...</div>
    </div>

    <button class="btn-action" style="margin-top: 1.5rem; background: var(--border); color: #fff;" onclick="restartTest()">Retake Assessment</button>
  </div>
</div>

<script>
  // Firebase Configuration & Initialization
  const firebaseConfig = {
    apiKey: "AIzaSyAMV8VSZfnaaqWlnQt0sLG4zHShnF3-TAA",
    authDomain: "vocab-tester-d7649.firebaseapp.com",
    databaseURL: "https://vocab-tester-d7649-default-rtdb.firebaseio.com",
    projectId: "vocab-tester-d7649",
    storageBucket: "vocab-tester-d7649.firebasestorage.app",
    messagingSenderId: "155699689942",
    appId: "1:155699689942:web:9e59240064e4bf1d3d8c77",
    measurementId: "G-CKJTJ9RSZN"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  if (firebase.analytics) {
    firebase.analytics();
  }

  const BAND_CONFIG = {
    beginner: { label: "Beginner / Core (1 – 3,000 words)", size: 3000 },
    intermediate: { label: "Intermediate (3,001 – 10,000 words)", size: 7000 },
    advanced: { label: "Advanced (10,001 – 25,000 words)", size: 15000 },
    grandmaster: { label: "Grandmaster (25,001 – 50,000+ words)", size: 25000 }
  };

  const QUESTION_BANK = [
    // --- 10 BEGINNER ---
    { word: "hesitate", pos: "verb", tier: "beginner", correct: 1, options: ["To pause briefly due to physical exhaustion", "To pause briefly before saying or doing something", "To pause briefly to observe distant scenery", "To pause briefly during formal speech delivery"] },
    { word: "glance", pos: "verb", tier: "beginner", correct: 0, options: ["To look quickly and briefly at something", "To look intensely and steadily at something", "To look secretively through an opening", "To look angrily at an opposing person"] },
    { word: "reluctant", pos: "adjective", tier: "beginner", correct: 2, options: ["Feeling anxious about future uncertainty", "Feeling indifferent to outside advice", "Feeling hesitant and unwilling to act", "Feeling unable to make logical sense"] },
    { word: "abundant", pos: "adjective", tier: "beginner", correct: 3, options: ["Existing in small, concentrated amounts", "Existing in rare, prized distributions", "Existing in dense, unorganized clumps", "Existing in large, plentiful quantities"] },
    { word: "fragile", pos: "adjective", tier: "beginner", correct: 0, options: ["Easily broken, damaged, or harmed", "Easily bent without losing shape", "Easily dissolved in cold liquids", "Easily hidden from plain view"] },
    { word: "hostile", pos: "adjective", tier: "beginner", correct: 1, options: ["Showing cold, detached disinterest", "Showing open, aggressive unfriendliness", "Showing excessive, frantic nervousness", "Showing stubborn, quiet disagreement"] },
    { word: "thrive", pos: "verb", tier: "beginner", correct: 2, options: ["To survive through harsh deprivation", "To adapt slowly to surrounding climate", "To grow vigorously and develop successfully", "To spread rapidly across foreign terrain"] },
    { word: "conceal", pos: "verb", tier: "beginner", correct: 1, options: ["To protect something from direct damage", "To keep something hidden from sight", "To transport something under cover", "To hold something in secure storage"] },
    { word: "dread", pos: "noun", tier: "beginner", correct: 3, options: ["A sharp feeling of sudden irritation", "A lingering sense of deep sorrow", "A dull feeling of quiet confusion", "A great fear of future misfortune"] },
    { word: "seldom", pos: "adverb", tier: "beginner", correct: 0, options: ["Almost never; on rare occasions", "At fixed, predictable intervals", "Without prior notice or warning", "Only when strictly necessary"] },

    // --- 10 INTERMEDIATE ---
    { word: "mitigate", pos: "verb", tier: "intermediate", correct: 1, options: ["To prevent a bad event from happening entirely", "To make a bad situation less severe or serious", "To postpone a bad consequence until a later date", "To identify the underlying cause of a bad result"] },
    { word: "pragmatic", pos: "adjective", tier: "intermediate", correct: 3, options: ["Guided primarily by theoretical doctrine", "Guided primarily by emotional conviction", "Guided primarily by historical precedent", "Guided primarily by practical considerations"] },
    { word: "scrutinize", pos: "verb", tier: "intermediate", correct: 0, options: ["To examine or inspect very closely and thoroughly", "To critique or evaluate from an artistic perspective", "To summarize or condense for quick reading", "To verify or cross-check against an index"] },
    { word: "ubiquitous", pos: "adjective", tier: "intermediate", correct: 2, options: ["Present only in specialized technical contexts", "Present in increasing quantities over time", "Present, appearing, or found everywhere", "Present without drawing conscious notice"] },
    { word: "tenuous", pos: "adjective", tier: "intermediate", correct: 1, options: ["Showing temporary hesitation in action", "Very weak, slight, or unsubstantial", "Flexible under strong tensile pressure", "Lacking clear visual distinctness"] },
    { word: "candid", pos: "adjective", tier: "intermediate", correct: 0, options: ["Truthful and straightforward; frank", "Polite and agreeable; diplomatic", "Spontaneous and disorganized; casual", "Brief and concise; to the point"] },
    { word: "augment", pos: "verb", tier: "intermediate", correct: 3, options: ["To replace an element with a better alternative", "To refine an existing product for market sale", "To accelerate the completion of a project", "To make something greater by adding to it"] },
    { word: "complacent", pos: "adjective", tier: "intermediate", correct: 2, options: ["Overly eager to satisfy the demands of others", "Unwilling to acknowledge alternative viewpoints", "Self-satisfied and uncritical of one's shortcomings", "Resigned to unfavorable circumstances without protest"] },
    { word: "lucid", pos: "adjective", tier: "intermediate", correct: 1, options: ["Brightly illuminated by an external light source", "Expressed clearly; easy to understand", "Composed with artistic and refined elegance", "Free from any emotional bias or personal favor"] },
    { word: "reiterate", pos: "verb", tier: "intermediate", correct: 0, options: ["To state something again for emphasis or clarity", "To explain something using simpler terminology", "To defend an assertion against critical scrutiny", "To summarize the key points of an ongoing debate"] },

    // --- 10 ADVANCED ---
    { word: "ephemeral", pos: "adjective", tier: "advanced", correct: 2, options: ["Physically fragile and prone to crumbling", "Visually faint and difficult to perceive", "Lasting for a very short period of time", "Existing only in subjective imagination"] },
    { word: "obfuscate", pos: "verb", tier: "advanced", correct: 1, options: ["To fabricate facts to mislead an audience", "To make something obscure, unclear, or unintelligible", "To omit critical context to simplify a summary", "To delay delivering an official public statement"] },
    { word: "sycophant", pos: "noun", tier: "advanced", correct: 0, options: ["A person who acts obsequiously to gain advantage", "A person who attacks cherished traditional beliefs", "A person who displays arrogant intellectual pride", "A person who deceives others for monetary profit"] },
    { word: "pernicious", pos: "adjective", tier: "advanced", correct: 3, options: ["Having an overtly violent and explosive impact", "Having an unpredictable and erratic trajectory", "Having a sudden and disastrous consequence", "Having a harmful effect, especially in a gradual way"] },
    { word: "recalcitrant", pos: "adjective", tier: "advanced", correct: 1, options: ["Reluctant to participate due to lack of skill", "Obstinately uncooperative toward authority", "Prone to sudden changes of mood or intention", "Unwilling to communicate with unfamiliar peers"] },
    { word: "alacrity", pos: "noun", tier: "advanced", correct: 0, options: ["Brisk and cheerful readiness to act", "Calm and unshakable self-confidence", "Quiet and respectful deference to rank", "Sharp and clever mental wit in speech"] },
    { word: "laconic", pos: "adjective", tier: "advanced", correct: 2, options: ["Speaking in a harsh and aggressive manner", "Speaking with excessive formality and jargon", "Using very few words; concise to the point of seeming rude", "Using melodic and rhythmically pleasing sentence cadences"] },
    { word: "fastidious", pos: "adjective", tier: "advanced", correct: 3, options: ["Excessively anxious about upcoming deadlines", "Deeply suspicious of unverified statements", "Reluctant to delegate work to colleagues", "Very attentive to and concerned about accuracy and detail"] },
    { word: "ineffable", pos: "adjective", tier: "advanced", correct: 1, options: ["Impossible to measure with standard instruments", "Too great or extreme to be expressed in words", "Beyond the reach of normal human cognition", "Incapable of being changed or reversed by law"] },
    { word: "equanimity", pos: "noun", tier: "advanced", correct: 0, options: ["Mental calmness and composure, especially in a difficult situation", "Moral integrity and unwavering adherence to ethical principles", "Impartial fairness and equality in resolving judicial disputes", "Modest humility and avoidance of claiming personal credit"] },

    // --- 5 GRANDMASTER ---
    { word: "perspicacity", pos: "noun", tier: "grandmaster", correct: 1, options: ["The ability to articulate concepts with fluid eloquence", "The quality of having keen mental discernment and insight", "The capacity to retain extensive factual information", "The tendency to maintain resolute focus under distress"] },
    { word: "sesquipedalian", pos: "adjective", tier: "grandmaster", correct: 3, options: ["Characterized by antique grammatical structures", "Characterized by excessively ornate rhetorical style", "Characterized by slow and ponderous delivery", "Characterized by the use of long words"] },
    { word: "pulchritude", pos: "noun", tier: "grandmaster", correct: 0, options: ["Physical beauty and aesthetic appeal", "Moral righteousness and virtuous conduct", "Stately grandeur and commanding presence", "Deep wisdom gained through lived experience"] },
    { word: "tenebrous", pos: "adjective", tier: "grandmaster", correct: 2, options: ["Physically brittle due to extreme dehydration", "Conceptually complex and difficult to analyze", "Dark, shadowy, or obscure in character", "Vulnerable to sudden corruption or decay"] },
    { word: "defenestration", pos: "noun", tier: "grandmaster", correct: 1, options: ["The act of formally stripping an official of their title", "The act of throwing someone or something out of a window", "The act of abolishing an established constitutional body", "The act of dismantling an ancient administrative code"] }
  ];

  let currentIndex = 0;
  let selectedOption = null;
  let computedVocabSize = 0;
  const userAnswers = [];

  function loadQuestion() {
    selectedOption = null;
    const q = QUESTION_BANK[currentIndex];
    
    document.getElementById("tier-indicator").innerText = q.tier;
    document.getElementById("progress-text").innerText = `Question ${currentIndex + 1} of ${QUESTION_BANK.length}`;
    document.getElementById("progress-bar").style.width = `${((currentIndex) / QUESTION_BANK.length) * 100}%`;
    document.getElementById("word-target").innerText = q.word;
    document.getElementById("word-type").innerText = q.pos;
    document.getElementById("next-btn").disabled = true;
    document.getElementById("next-btn").innerText = (currentIndex === QUESTION_BANK.length - 1) ? "Calculate Vocabulary Size" : "Next Word";

    const container = document.getElementById("options-container");
    container.innerHTML = "";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => selectOption(idx);
      container.appendChild(btn);
    });
  }

  function selectOption(index) {
    selectedOption = index;
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
      btn.classList.toggle("selected", idx === index);
    });
    document.getElementById("next-btn").disabled = false;
  }

  function handleNext() {
    if (selectedOption === null) return;
    
    const q = QUESTION_BANK[currentIndex];
    userAnswers.push({
      tier: q.tier,
      isCorrect: selectedOption === q.correct
    });

    currentIndex++;
    if (currentIndex < QUESTION_BANK.length) {
      loadQuestion();
    } else {
      renderResults();
    }
  }

  function renderResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";

    const stats = {
      beginner: { total: 0, correct: 0 },
      intermediate: { total: 0, correct: 0 },
      advanced: { total: 0, correct: 0 },
      grandmaster: { total: 0, correct: 0 }
    };

    userAnswers.forEach(ans => {
      stats[ans.tier].total++;
      if (ans.isCorrect) stats[ans.tier].correct++;
    });

    let totalVocabulary = 0;
    const listContainer = document.getElementById("tier-results-list");
    listContainer.innerHTML = "";

    for (const [tierKey, data] of Object.entries(stats)) {
      const rawAccuracy = data.total > 0 ? (data.correct / data.total) : 0;
      const adjustedRate = Math.max(0, (4 * rawAccuracy - 1) / 3);
      const tierEstimatedWords = Math.round(adjustedRate * BAND_CONFIG[tierKey].size);
      totalVocabulary += tierEstimatedWords;

      const accuracyPct = Math.round(rawAccuracy * 100);

      listContainer.innerHTML += `
        <div class="tier-row">
          <div class="tier-label-group">
            <span><strong>${BAND_CONFIG[tierKey].label}</strong></span>
            <span style="color: var(--primary); font-weight: 700;">${data.correct}/${data.total} (${accuracyPct}%)</span>
          </div>
          <div class="bar-track">
            <div class="bar-inner" style="width: ${accuracyPct}%"></div>
          </div>
        </div>
      `;
    }

    computedVocabSize = Math.max(800, totalVocabulary);
    document.getElementById("final-vocab-count").innerText = `${computedVocabSize.toLocaleString()} words`;

    let rank = "Basic Communicator";
    if (computedVocabSize > 35000) rank = "Lexical Grandmaster (Top 1%)";
    else if (computedVocabSize > 22000) rank = "Avid Reader / Academic (Top 10%)";
    else if (computedVocabSize > 12000) rank = "Fluent Native / Professional";
    else if (computedVocabSize > 5000) rank = "Intermediate Speaker";

    document.getElementById("final-rank").innerText = rank;
    fetchLeaderboard();
  }

  function saveScore() {
    const nameInput = document.getElementById("player-name");
    const name = nameInput.value.trim();
    if (!name) return alert("Please enter a name first!");

    const record = { name: name, score: computedVocabSize, timestamp: Date.now() };

    db.ref("leaderboard").push(record)
      .then(() => {
        document.getElementById("submit-box").style.display = "none";
      })
      .catch(err => {
        console.error("Database write failed: ", err);
        alert("Failed to record score. Please check database permissions.");
      });
  }

  function fetchLeaderboard() {
    const lbContainer = document.getElementById("leaderboard-container");

    db.ref("leaderboard").orderByChild("score").limitToLast(15).on("value", snapshot => {
      const scores = [];
      snapshot.forEach(child => scores.push(child.val()));
      scores.sort((a, b) => b.score - a.score);
      renderLeaderboardUI(scores);
    }, err => {
      console.error("Database read failed: ", err);
      lbContainer.innerHTML = `<div class="lb-row" style="color: var(--muted);">Unable to load scores. Check database rules.</div>`;
    });
  }

  function renderLeaderboardUI(scores) {
    const lbContainer = document.getElementById("leaderboard-container");
    if (!scores.length) {
      lbContainer.innerHTML = `<div class="lb-row" style="color: var(--muted);">No scores recorded yet. Be the first!</div>`;
      return;
    }

    lbContainer.innerHTML = scores.map((item, idx) => `
      <div class="lb-row">
        <span class="lb-rank ${idx === 0 ? 'top-1' : ''}">#${idx + 1}</span>
        <span class="lb-name">${escapeHtml(item.name)}</span>
        <span class="lb-score">${item.score.toLocaleString()} words</span>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
  }

  function restartTest() {
    currentIndex = 0;
    userAnswers.length = 0;
    document.getElementById("submit-box").style.display = "flex";
    document.getElementById("player-name").value = "";
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
  }

  loadQuestion();
</script>
</body>
</html>
