<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOREMASTERJ // GAME DEV PORTFOLIO</title>
  <!-- Google Font for Tactical Monospace Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Angled Evangelion Hex Grid Background -->
  <div class="bg-perspective-container">
    <div class="hex-grid-bg"></div>
  </div>

  <!-- Tactical UI Card Container -->
  <main class="portfolio-card">
    
    <!-- Top Bar metadata -->
    <div class="card-header">
      <span class="tech-tag">// SYS_STATUS: OPTIMAL</span>
      <span class="tech-tag">LOREMASTERJ_DEV_B1</span>
    </div>

    <!-- Main Hero Box -->
    <section class="hero-viewport">
      <div class="corner-bracket top-left"></div>
      <div class="corner-bracket top-right"></div>
      <div class="corner-bracket bottom-left"></div>
      <div class="corner-bracket bottom-right"></div>
      
      <div class="viewport-content">
        <span class="viewport-label">HERO CANVAS // WIREFRAME VIEW</span>
        <div class="placeholder-graphic">
          <p>[ GAMEPLAY / ENGINE DEMO CANVAS ]</p>
        </div>
      </div>
    </section>

    <!-- Bio / Info -->
    <section class="dev-info">
      <h1>LOREMASTERJ <span class="accent">//</span> GAME DEVELOPER</h1>
      <p class="subtitle">SPECIALIZING IN GAME MECHANICS & DESIGN</p>
    </section>

    <!-- Projects Section -->
    <section class="projects-section">
      <div class="section-title">CORE_PROJECTS // DESIGN_ARCHIVES</div>
      
      <!-- Dynamic Project Cards -->
      <div class="projects-grid" id="projectsGrid"></div>
    </section>

    <!-- Footer Barcode & Tags -->
    <footer class="card-footer">
      <div class="barcode">
        <div class="barcode-lines"></div>
        <span class="barcode-num">332 253 668 4885</span>
      </div>
      <div class="footer-tags">
        <span class="badge">END_DEV_01</span>
        <span class="badge">IPX3</span>
        <span class="badge">SPEC_81</span>
      </div>
    </footer>

  </main>

  <!-- FLOATING HUD MOUSE-PREVIEW CONTAINER -->
  <div class="hud-preview" id="hudPreview">
    <!-- Corner brackets -->
    <div class="corner-bracket top-left"></div>
    <div class="corner-bracket top-right"></div>
    <div class="corner-bracket bottom-left"></div>
    <div class="corner-bracket bottom-right"></div>

    <!-- Animated Reticle / Ring -->
    <div class="hud-ring"></div>
    
    <!-- Floating Symbols / Hairlines -->
    <span class="hud-crosshair top">+</span>
    <span class="hud-crosshair bottom">+</span>
    <div class="hud-scanning-line"></div>

    <!-- Image Canvas -->
    <div class="hud-image-box">
      <img id="hudImg" src="" alt="Project Preview">
    </div>

    <!-- HUD Label -->
    <div class="hud-footer">
      <span id="hudTag" class="hud-tag">// SCANNING_FILE...</span>
      <span class="hud-status">[LIVE_PREVIEW]</span>
    </div>
  </div>

<!-- SCRIPT: EASY PROJECT DATA MANAGEMENT & CURSOR HUD -->
  <script>
    // =========================================================================
    // ADD NEW PROJECTS HERE!
    // Set 'imageUrl' to your GDD cover image file or screenshot!
    // =========================================================================
    const projectsData = [
      {
        id: "DATA_LOG_01",
        title: "MECHANIC DESIGN DOC",
        category: "SYSTEMS DESIGN // GDD",
        imageUrl: "https://via.placeholder.com/300x200/111111/FFFFFF?text=GDD+COVER+01", // Replace with your image file path
        fileUrl: "sample-gdd.pdf"
      },
      {
        id: "DATA_LOG_02",
        title: "GREYBOX LEVEL LAYOUT",
        category: "LEVEL DESIGN // BLOCKOUT",
        imageUrl: "https://via.placeholder.com/300x200/111111/FFFFFF?text=LEVEL+BLOCKOUT", // Replace with your image file path
        fileUrl: "level-layout-notes.pdf"
      }
    ];

    const hud = document.getElementById('hudPreview');
    const hudImg = document.getElementById('hudImg');
    const hudTag = document.getElementById('hudTag');

    // AUTOMATIC CARD RENDERER
    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = '';

      projectsData.forEach((project) => {
        const card = document.createElement('div');
        card.className = 'project-card';
        
        // Open file on click
        card.onclick = () => window.open(project.fileUrl, '_blank');

        // Mouse hover handlers for HUD
        card.onmouseenter = () => showHud(project);
        card.onmouseleave = hideHud;

        card.innerHTML = `
          <div class="proj-header">
            <span class="proj-id">${project.id}</span>
            <span class="proj-indicator">[OPEN_DOC]</span>
          </div>
          <div class="proj-title">${project.title}</div>
          <div class="proj-desc">${project.category}</div>
        `;

        grid.appendChild(card);
      });
    }

    // CURSOR TRACKING LOGIC (ATTACHED TO UPPER RIGHT OF MOUSE)
    document.addEventListener('mousemove', (e) => {
      // Anchored to upper-right corner:
      // Offset +15px to the right of cursor
      // Offset -210px upward so the box sits ABOVE the cursor
      const x = e.clientX + 15;
      const y = e.clientY - 210;

      // Screen boundary checks to keep it on screen near edges
      const maxX = window.innerWidth - 260;
      const finalX = x > maxX ? e.clientX - 250 : x;
      const finalY = y < 10 ? e.clientY + 20 : y;

      hud.style.left = `${finalX}px`;
      hud.style.top = `${finalY}px`;
    });

    function showHud(project) {
      hudImg.src = project.imageUrl;
      hudTag.innerText = `// FILE: ${project.id}`;
      hud.classList.add('active');
    }

    function hideHud() {
      hud.classList.remove('active');
    }

    // Initial Render
    renderProjects();
  </script>

</body>
</html>
